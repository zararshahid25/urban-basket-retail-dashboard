services:
  postgres:
    image: postgres:16-alpine
    container_name: urban_basket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urban_basket}
      POSTGRES_USER: ${POSTGRES_USER:-urban_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urban_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - urban_basket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urban_user} -d ${POSTGRES_DB:-urban_basket}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: urban_basket_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@urbanbasket.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_dev_password}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  urban_basket_pgdata:

